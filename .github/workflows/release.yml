name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  COLUMNS: 150

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: spread-x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: spread-aarch64-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install GPUI system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libwayland-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          lookup-only: false
          cache-on-failure: true

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        id: package
        run: |
          BINARY="target/${{ matrix.target }}/release/spread"
          strip "$BINARY"
          if [ "${{ runner.os }}" = "macOS" ]; then
            APP_DIR="$RUNNER_TEMP/Spread.app"
            mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
            install -m 755 "$BINARY" "$APP_DIR/Contents/MacOS/spread"
            install -m 644 packaging/macos/Info.plist "$APP_DIR/Contents/Info.plist"
            install -m 644 packaging/macos/Spread.icns "$APP_DIR/Contents/Resources/Spread.icns"
            ditto -c -k --keepParent "$APP_DIR" "$RUNNER_TEMP/${{ matrix.artifact }}.zip"
            echo "artifact=${{ matrix.artifact }}.zip" >> "$GITHUB_OUTPUT"
            echo "artifact_path=$RUNNER_TEMP/${{ matrix.artifact }}.zip" >> "$GITHUB_OUTPUT"
          else
            zip -j "$RUNNER_TEMP/${{ matrix.artifact }}.zip" "$BINARY"
            echo "artifact=${{ matrix.artifact }}.zip" >> "$GITHUB_OUTPUT"
            echo "artifact_path=$RUNNER_TEMP/${{ matrix.artifact }}.zip" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.package.outputs.artifact_path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: artifacts/*
          generate_release_notes: true
